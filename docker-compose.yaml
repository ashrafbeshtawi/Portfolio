services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    ports:
      - "8080:80"
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://portfolio:portfolio@db:5432/portfolio?serverVersion=18&charset=utf8"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    volumes:
      # postgres:18 images store data under /var/lib/postgresql (not .../data)
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
